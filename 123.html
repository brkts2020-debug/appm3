<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم العقود والمستخلصات - أسلوب قوى</title>
    <link rel="stylesheet" href="css/page1.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="company-info">
            <span>🏢</span>
            <div class="company-name">
                شركة الأصايل للمقاولات العامة
            </div>
        </div>

        <div class="user-section">
            مرحباً: بركات شعبان
        </div>
    </div>

    <div class="main-wrapper">

        <!-- القائمة -->
        <div class="right-services-sidebar">

            <div class="sidebar-title">
                
                خدمات إدارة المقاولين
                

            
            </div>
            <hr>

            <button class="service-btn"
                onclick="openService(event,'srv-agreement')">
              
                📝 تسجيل اتفاقية جديدة
                
            </button>

            <button class="service-btn"
                onclick="openService(event,'srv-work')">
                🏗️ تسجيل أعمال للمقاول
            </button>

            <button class="service-btn active"
                onclick="openService(event,'srv-invoice')">
                📝 إصدار مستخلص مالي
            </button>

            <button class="service-btn"
                onclick="openService(event,'srv-payment')">
                💰 إصدار سند صرف
            </button>

            <button class="service-btn"
                onclick="openService(event,'srv-order')">
                📄 أمر صرف المستخلص
            </button>

            <button class="service-btn"
                onclick="openService(event,'srv-contractor')">
                👷 إضافة مقاول جديد
            </button>

            <button class="service-btn"
                onclick="openService(event,'srv-job')">
                🛠️ إضافة بند عمل جديد
            </button>

            <button class="service-btn"
                onclick="openService(event,'srv-agreement')">
                📦 إضافة وحدة قياس أعمال
            </button>
            <button class="service-btn"
                onclick="openService(event,'srv-agreement')">
                📦 تسجيل خروج 
            </button>


        </div>
  

        <!-- مساحة العمل -->
        <div class="left-workspace">

            <!-- اتفاقية -->
            <div id="srv-agreement"
                class="workspace-card">

                <div class="card-title">
                  إنشاء اتفاقية جديدة
                </div>

                 <div class="form-group">
                    <label>اسم المشروع</label>
                    <input type="text"
                        placeholder="أدخل اسم المشروع">
                </div>

                <div class="form-group">
                    <label>اسم المشروع</label>
                    <input type="text"
                        placeholder="أدخل اسم المشروع">
                </div>
                <div class="form-group">
                    <label >تاريخ الاتفاق</label>
                    <input type="date">
                </div><br>

                <button class="action-btn">
                 الخطوة التالية
                </button>

            </div> 

            <!-- الأعمال -->
            <div id="srv-work"
                class="workspace-card">

                <div class="card-title">
                    تسجيل الأعمال الميدانية
                </div>

                <div class="form-group">
                    <label>اسم العمل</label>
                    <input type="text"
                        placeholder="مثال: صب خرسانة">
                </div>

                <div class="form-group">
                    <label>الكمية</label>
                    <input type="number"
                        placeholder="0">
                </div>

                <button class="action-btn">
                    إضافة العمل
                </button>

            </div>

            <!-- المستخلص -->
            <div id="srv-invoice"
                class="workspace-card active">

                <div class="card-title">
                    مراجعة وإصدار المستخلص
                </div>

                <div class="summary-box">

                    <div class="summary-row">
                        <span>إجمالي الأعمال:</span>
                        <strong>100,000 ر.س</strong>
                    </div>

                    <div class="summary-row">
                        <span>استقطاع 10%:</span>
                        <span style="color:red;">
                            -10,000 ر.س
                        </span>
                    </div>

                    <div class="summary-row">
                        <span>الصافي:</span>
                        <strong style="color:green;">
                            85,000 ر.س
                        </strong>
                    </div>

                </div>

                <br>

                <button class="action-btn success-btn">
                    اعتماد المستخلص
                </button>

            </div>

            <!-- سند الصرف -->
            <div id="srv-payment"
                class="workspace-card">

                <div class="card-title">
                    سند الصرف المالي
                </div>

                <div class="form-group">
                    <label>طريقة الدفع</label>

                    <select>
                        <option>
                            تحويل بنكي سريع
                        </option>

                        <option>
                            صرف نقدي
                        </option>

                        <option value="1">
                            عهدة عباس ابن فرناس
                        </option>
                       <option value="10">بركات

                       </option>

                    </select>
                </div>

                <button class="action-btn">
                    إصدار السند
                </button>

            </div>

            <!-- خدمات إضافية -->
            <div id="srv-order" class="workspace-card">
                <div class="card-title">
                    أمر صرف المستخلص
                </div>
            </div>

            <div id="srv-contractor" class="workspace-card">
                <div class="card-title">
                    إضافة مقاول جديد
                </div>
            </div>

            <div id="srv-job" class="workspace-card">
                <div class="card-title">
                    إضافة عمل جديد
                </div>
            </div>

            <div id="srv-unit" class="workspace-card">
                <div class="card-title">
                    إضافة وحدة أعمال
                </div>
            </div>

        </div>
    </div>

    <script>
        function openService(evt, serviceId) {

            const cards =
                document.querySelectorAll('.workspace-card');

            cards.forEach(card => {
                card.classList.remove('active');
            });

            const buttons =
                document.querySelectorAll('.service-btn');

            buttons.forEach(btn => {
                btn.classList.remove('active');
            });

            document
                .getElementById(serviceId)
                .classList.add('active');

            evt.currentTarget
                .classList.add('active');
        }
    </script>


</body>
</html>
