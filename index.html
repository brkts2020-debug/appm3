<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | شركة الأصايل</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page-wrapper">

        <section class="login-card">

            <!-- Header -->
            <header class="login-header">

                <div class="brand-icon">
                    <i class="fas fa-building-shield"></i>
                </div>

                <h1>مرحبًا بعودتك</h1>

                <p class="company-name">
                    شركة الأصايل للمقاولات العامة - مصر
                </p>

                <p class="login-text">
                    سجل الدخول للوصول إلى النظام
                </p>

            </header>

            <!-- Form -->
            <form id="loginForm"
                  class="login-form"
                  novalidate>

                <!-- الهوية -->
                <div class="input-group">

                    <label for="identity">
                        رقم الهوية / الإقامة
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-id-card input-icon"></i>

                        <input
                            type="text"
                            id="identity"
                            name="identity"
                            inputmode="numeric"
                            autocomplete="username"
                            maxlength="20"
                            placeholder="أدخل رقم الهوية أو الإقامة"
                            required>

                    </div>

                    <small id="identityError"
                           class="error-message">
                    </small>

                </div>

                <!-- كلمة المرور -->
                <div class="input-group">

                    <div class="label-row">
                        <label for="password">
                            كلمة المرور
                        </label>

                        <a href="#"
                           class="forgot-password">
                            نسيت كلمة المرور؟
                        </a>
                    </div>

                    <div class="input-wrapper password-wrapper">

                        <i class="fas fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            minlength="6"
                            placeholder="••••••••"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="إظهار كلمة المرور">

                            <i class="far fa-eye"></i>

                        </button>

                    </div>

                    <small id="passwordError"
                           class="error-message">
                    </small>

                </div>

                <!-- تذكرني -->
                <div class="form-options">

                    <label class="remember-me">

                        <input type="checkbox">

                        <span>
                            تذكر بيانات الدخول
                        </span>

                    </label>

                </div>

                <!-- زر الدخول -->
                <button
                    type="submit"
                    class="submit-btn">

                    <span>تسجيل الدخول</span>

                    <i class="fas fa-arrow-left"></i>

                </button>

            </form>

            <!-- Footer -->
            <footer class="login-footer">

                <p>
                    لا تمتلك حسابًا؟
                    <a href="register.html">
                        إنشاء حساب جديد
                    </a>
                </p>

            </footer>

        </section>

    </main>

    <script>
        const loginForm =
            document.getElementById("loginForm");

        const identityInput =
            document.getElementById("identity");

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const identityError =
            document.getElementById("identityError");

        const passwordError =
            document.getElementById("passwordError");


        // إظهار وإخفاء كلمة المرور
        togglePassword.addEventListener(
            "click",
            () => {

                const hidden =
                    passwordInput.type ===
                    "password";

                passwordInput.type =
                    hidden
                    ? "text"
                    : "password";

                togglePassword
                .querySelector("i")
                .className =
                    hidden
                    ? "far fa-eye-slash"
                    : "far fa-eye";
            }
        );


        // أرقام فقط للهوية
        identityInput.addEventListener(
            "input",
            () => {

                identityInput.value =
                    identityInput.value
                    .replace(/\D/g, "");
            }
        );


        // Validation
        loginForm.addEventListener(
            "submit",
            (e) => {

                e.preventDefault();

                identityError.textContent = "";
                passwordError.textContent = "";

                let valid = true;

                if (!identityInput.value.trim()) {

                    identityError.textContent =
                        "يرجى إدخال رقم الهوية";

                    valid = false;
                }

                if (
                    passwordInput.value.length < 6
                ) {

                    passwordError.textContent =
                        "كلمة المرور قصيرة";

                    valid = false;
                }

                if (valid) {

                    console.log({
                        identity:
                        identityInput.value,

                        password:
                        passwordInput.value
                    });

                    alert(
                        "تم تسجيل الدخول بنجاح"
                    );
                }
            }
        );
    </script>

</body>
</html>
