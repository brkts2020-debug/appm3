<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | شركة الاصايل</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page-container">

        <div class="login-card">

            <div class="logo-wrapper">
                <div class="logo-circle">
                    <i class="fas fa-building"></i>
                </div>
            </div>

            <div class="login-header">
                <h1>مرحبًا بك</h1>

                <p class="company-name">
                    شركة الأصايل للمقاولات العامة
                </p>

                <p class="sub-text">
                    قم بتسجيل الدخول للوصول إلى حسابك
                </p>
            </div>

            <form id="loginForm" action="login.php" method="POST">

                <div class="input-group">

                    <label for="identity">
                        رقم الهوية / الإقامة
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-id-card input-icon"></i>

                        <input
                            type="text"
                            id="identity"
                            name="national_id"
                            placeholder="أدخل رقم الهوية"
                            maxlength="20"
                            required>

                    </div>

                    <small id="identityError" class="error-message"></small>

                </div>

                <div class="input-group">

                    <div class="label-row">

                        <label for="password">
                            كلمة المرور
                        </label>

                    </div>

                    <div class="input-wrapper">

                        <i class="fas fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">

                            <i class="far fa-eye"></i>

                        </button>

                    </div>

                    <small id="passwordError" class="error-message"></small>

                </div>

                <div class="remember-row">

                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>تذكرني</span>
                    </label>

                </div>

                <button
                    type="submit"
                    class="submit-btn">

                    تسجيل الدخول

                </button>

            </form>

            <div class="register-link">
                لا تمتلك حساب؟
                <a href="registerm.html">
                    إنشاء حساب
                </a>
            </div>
            <div class="register-link">
                تجربة 
                <a href="dashboard.html">
                    اضغط هنا 
                </a>
            </div>

        </div>

    </div>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");
        const identity = document.getElementById("identity");

        // أرقام فقط
        identity.addEventListener("input", () => {
            identity.value = identity.value.replace(/\D/g, "");
        });

        // إظهار وإخفاء كلمة المرور
        toggle.addEventListener("click", () => {

            const hidden = password.type === "password";

            password.type = hidden ? "text" : "password";

            toggle.innerHTML = hidden
                ? '<i class="far fa-eye-slash"></i>'
                : '<i class="far fa-eye"></i>';
        });
    </script>

</body>
</html>
