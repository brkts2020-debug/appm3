<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شركة الأصايل  </title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="lock-icon-wrapper">
            <div class="lock-icon">
                <i class="fas fa-lock"></i>
            </div>
        </div>

        <h2>تسجيل الدخول</h2>
        <h3 class="company-name">شركة الأصايل للمقاولات العامة</h3>

        <form id="loginForm">
            <div class="input-group">
                <label for="identity">رقم الهوية / الإقامة</label>
                <input type="text" id="identity" placeholder="أدخل رقم الهوية أو الإقامة" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">تسجيل دخول</button>
        </form>

        <div class="register-link">
            <a href="#">لا امتلك حساب؟ انشاء حساب جديد</a>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // تبديل نوع الحقل بين password و text
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // تغيير شكل العين (مفتوحة / مغلقة)
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
